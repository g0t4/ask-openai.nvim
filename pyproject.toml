[project]
name = "ask-openai-nvim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.9.0",
    "aiofiles>=24.1.0",
    "argcomplete>=3.7.0",
    "assertpy>=1.1",
    "asyncio>=3.4.3",
    "faiss-cpu>=1.11.0",
    "httpx>=0.28.1",
    "humanize>=4.15.0",
    "ipykernel>=6.29.5",
    "langchain>=1.2.18",
    "langchain-llama-server",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "matplotlib>=3.10.3",
    "mcp>=1.28.0",
    "msgpack>=1.1.1",
    "numpy>=2.3.0",
    "pathspec>=0.12.1",
    "portion>=2.6.1",
    "pydantic>=2.11.7",
    "pygls==2.0.0a6",
    "pympler>=1.1",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
    "pyright>=1.1.404",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-watch>=4.2.0",
    "pywhispercpp>=1.5.1",
    "qwen-vl-utils>=0.0.14",
    "rank-bm25>=0.2.2",
    "requests>=2.32.3",
    "rich>=14.0.0",
    "rx>=3.2.0",
    "sentence-transformers>=4.1.0",
    "setuptools>=80.9.0",
    "sounddevice>=0.5.6",
    "textual>=8.2.8",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack==1.3.3",
    "tree-sitter-xonsh>=0.2.2",
    "whoosh>=2.7.4",
    "yapf>=0.43.0",
    "wes_package",
]

[tool.uv.sources]
wes_package = { path = "../dotfiles/tools/wes_package", editable = true }
langchain-llama-server = { path = "../langchain-llama-server" }
langchain-mcp-adapters = { path = "../../langchain-ai/langchain-mcp-adapters" }

# [tool.pyright]
# reportUnusedVariable = false
# reportUnusedExpression = false
# reportUnusedParameter = false
# THERE must be a bug in pyright b/c it flags variables that are unused as unused even when I tell it NOT to and by default it shouldn't...
#  and on the warning it doesn't list a rule so I can't figure out WTF is going on
#  just look at any unused variable or parameter, with leading underscore, and it bitches

[project.scripts]
view_trace = "tools.chat_viewer.__main__:main"
view_trace_tui = "tools.chat_viewer.textual_viewer:main"
browse_traces = "tools.chat_viewer.browser.__main__:main"
trace_dump = "tools.trace_dump.__main__:main"
pii_scanner = "tools.pii_scanner.__main__:main"

# * setuptools backend
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tools*"]
